name: Build Production Artifact

on:
  push:
    branches: [ main ]

jobs:
  build-production-artifact:
    # This workflow only packages a release. No hosting target is wired up, so it deploys nothing;
    # the name says exactly that so a green check is never mistaken for a deployment.
    name: Build Production Artifact
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Release Bundle
      run: dotnet publish KrishiLink.csproj --configuration Release --output ./publish

    - name: Generate Idempotent Migration Script
      env:
        ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=krishilink_release;Username=postgres;Password=placeholder
      run: |
        dotnet tool restore
        dotnet ef migrations script --idempotent --configuration Release --output ./publish/migrations.sql

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v7
      with:
        name: krishilink-release
        path: ./publish

    - name: Deployment Checklist
      run: |
        echo "Artifact built. Deploying it is a separate, manual step:"
        echo "- Apply publish/migrations.sql over a session/direct connection (not the transaction pooler)."
        echo "- Set AllowedHosts, App__PublicBaseUrl, ForwardedHeaders__KnownProxies/KnownNetworks."
        echo "- Mount DataProtection:KeyPath on persistent, backed-up storage and set DataProtection:CertificatePath."
        echo "- Configure Supabase Auth/Storage keys and PostgreSQL connections as host secrets."
