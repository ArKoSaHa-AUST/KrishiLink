name: Build & Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Artifacts & Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Release Bundle
      run: dotnet publish KrishiLink.csproj --configuration Release --output ./publish

    - name: Generate Idempotent Migration Script
      env:
        ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=krishilink_release;Username=postgres;Password=placeholder
      run: |
        dotnet tool restore
        dotnet ef migrations script --idempotent --configuration Release --output ./publish/migrations.sql

    - name: Validate Docker Build
      run: |
        echo "Building and verifying Docker image..."
        docker build -t krishilink:release .

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: krishilink-release
        path: ./publish

    - name: Trigger Render Deployment
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          echo "Triggering automated deployment on Render via Deploy Hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment (HTTP $HTTP_STATUS)."
          else
            echo "::warning::Render deploy hook returned unexpected status: $HTTP_STATUS."
          fi
        else
          echo "RENDER_DEPLOY_HOOK_URL secret not configured in GitHub repository."
          echo "To enable zero-touch continuous deployment:"
          echo "1. In Render Dashboard > Web Service > Settings, copy the 'Deploy Hook' URL."
          echo "2. In GitHub Repository > Settings > Secrets and variables > Actions, add secret RENDER_DEPLOY_HOOK_URL."
        fi
