name: CD Deploy Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://krishilink.example.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Production Release Bundle
      run: dotnet publish KrishiLink.csproj --configuration Release --output ./publish

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: krishilink-production
        path: ./publish

    - name: Deployment Configuration Reminder
      run: |
        echo "Verified GitHub Environment 'production' approval gate."
        echo "Production release bundle prepared in ./publish."
        echo "No hosting target is configured: this workflow does not deploy."
        echo "Configure Supabase Auth/Storage keys and PostgreSQL connections as host secrets."
        echo "Apply the reviewed PostgreSQL migrations through a session/direct connection."
        echo "Persist the Data Protection key directory on private durable storage."
