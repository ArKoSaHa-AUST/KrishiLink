name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and PostgreSQL Migration Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: |
        dotnet tool restore
        dotnet restore KrishiLink.csproj

    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes

    - name: Audit Vulnerable NuGet Packages
      run: dotnet list package --vulnerable --include-transitive

    - name: Secret and Sensitive Key Scanner
      run: |
        echo "Checking tracked files for secrets (only filenames are printed)..."
        if git ls-files -- .env .env.local | grep -q .; then
          echo "ERROR: Local environment files must not be committed."
          exit 1
        fi
        if git grep -IlE 'sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!README.md' ':!.env.example'; then
          echo "ERROR: Potential secret detected in a tracked file."
          exit 1
        fi
        echo "Secret scan passed."

    - name: Build Project (Release)
      run: dotnet build KrishiLink.csproj --configuration Release --no-restore

    - name: Validate PostgreSQL Model and Migration Script
      env:
        ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=krishilink_ci;Username=postgres;Password=ci-placeholder
      run: |
        dotnet ef migrations has-pending-model-changes --configuration Release --no-build
        dotnet ef migrations script --idempotent --configuration Release --no-build --output "$RUNNER_TEMP/krishilink-postgresql.sql"
